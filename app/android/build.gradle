// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Read by capacitor-filesystem's own build.gradle (and ours) so every subproject
// compiles against the same Kotlin version — a mismatch here causes cryptic
// "Unresolved reference" errors for perfectly ordinary stdlib functions.
ext.kotlin_version = '2.2.20'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
